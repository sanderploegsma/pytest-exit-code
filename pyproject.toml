[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-exit-code"
description = "A pytest plugin that overrides the built-in exit codes to retain more information about the test results."
# Version is derived from the git tag (e.g. v0.3.0) by setuptools-scm.
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sander Ploegsma", email = "sanderploegsma@gmail.com" }]
maintainers = [{ name = "Sander Ploegsma", email = "sanderploegsma@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
# pytest.StashKey (used by the plugin) was introduced in pytest 7.0.
dependencies = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/sanderploegsma/pytest-exit-code"

[project.entry-points.pytest11]
exit_code = "pytest_exit_code.plugin"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
